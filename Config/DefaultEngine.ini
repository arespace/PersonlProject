; 这些组件类随文件迁入新模块，但蓝图中的 SCS 组件模板与组件变量类型仍指向旧模块路径，
; 缺失重定向会导致「Component class is not set」、组件变量丢失、引脚类型不兼容等连锁报错。
+ClassRedirects=(OldName="/Script/PersonalProject.PP_WidgetComponent", NewName="/Script/PersonalProjectUI.PP_WidgetComponent")
+ClassRedirects=(OldName="/Script/PersonalProject.PP_InventoryComponent", NewName="/Script/PersonalProjectInventory.PP_InventoryComponent")
+ClassRedirects=(OldName="/Script/PersonalProject.PP_ShopComponent", NewName="/Script/PersonalProjectInventory.PP_ShopComponent")
+ClassRedirects=(OldName="/Script/PersonalProject.PP_QuestComponent", NewName="/Script/PersonalProjectQuest.PP_QuestComponent")
+ClassRedirects=(OldName="/Script/PersonalProject.PP_QuestEventBridge", NewName="/Script/PersonalProjectQuest.PP_QuestEventBridge")
; ===== 第一批 UI 解耦搬迁：会话/预览/大厅结构体下沉 Core =====
+ClassRedirects=(OldName="/Script/PersonalProject.PP_SessionManager", NewName="/Script/PersonalProjectCore.PP_SessionManager")
+ClassRedirects=(OldName="/Script/PersonalProject.PP_CharacterPreviewActor", NewName="/Script/PersonalProjectCore.PP_CharacterPreviewActor")
+StructRedirects=(OldName="/Script/PersonalProject.LobbyPlayerInfo", NewName="/Script/PersonalProjectCore.LobbyPlayerInfo")
+StructRedirects=(OldName="/Script/PersonalProject.RoomSettings", NewName="/Script/PersonalProjectCore.RoomSettings")
+StructRedirects=(OldName="/Script/PersonalProject.HostMigrationData", NewName="/Script/PersonalProjectCore.HostMigrationData")
+StructRedirects=(OldName="/Script/PersonalProject.RoomInfo", NewName="/Script/PersonalProjectCore.RoomInfo")
; ===== 接口下沉 Core：Query/Actions 接口从 Inventory/Quest 模块迁至 PersonalProjectCore =====
; U 接口类（UInterface 派生）有反射路径，跨模块迁移需重定向；蓝图资产引用概率低，补齐以防万一。
+ClassRedirects=(OldName="/Script/PersonalProjectInventory.PP_InventoryQuery", NewName="/Script/PersonalProjectCore.PP_InventoryQuery")
+ClassRedirects=(OldName="/Script/PersonalProjectInventory.PP_InventoryActions", NewName="/Script/PersonalProjectCore.PP_InventoryActions")
+ClassRedirects=(OldName="/Script/PersonalProjectInventory.PP_ShopQuery", NewName="/Script/PersonalProjectCore.PP_ShopQuery")
+ClassRedirects=(OldName="/Script/PersonalProjectInventory.PP_ShopActions", NewName="/Script/PersonalProjectCore.PP_ShopActions")
+ClassRedirects=(OldName="/Script/PersonalProjectQuest.PP_QuestQuery", NewName="/Script/PersonalProjectCore.PP_QuestQuery")
+StructRedirects=(OldName="/Script/PersonalProject.PP_ModifierSummary", NewName="/Script/PersonalProjectCore.PP_ModifierSummary")
; ===== 批次A UI 解耦搬迁：GAS 共享类型（AttributeSet/ASC）与角色基类下沉 Core =====
; UI 侧 UIViewModel/WidgetComponent/AttributeWidget 直接使用这三者，下沉后 UI 仅依赖 Core，
; 头文件相对路径保持不变（AbilitySystem/、Characters/），因此调用方无需改动 include 文本。
+ClassRedirects=(OldName="/Script/PersonalProject.PP_AttributeSet", NewName="/Script/PersonalProjectCore.PP_AttributeSet")
+ClassRedirects=(OldName="/Script/PersonalProject.PP_AbilitySystemComponent", NewName="/Script/PersonalProjectCore.PP_AbilitySystemComponent")
+ClassRedirects=(OldName="/Script/PersonalProject.PP_BaseCharacter", NewName="/Script/PersonalProjectCore.PP_BaseCharacter")
